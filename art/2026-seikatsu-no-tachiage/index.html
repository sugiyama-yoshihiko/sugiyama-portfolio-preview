        <div class="session-concept"><p>素材：陶器、家具、白い展示台、布など</p><p>ここ最近は、あちこちに拠点を持ち、活動を行い、長距離移動をする毎日なのですが、やはり生活を立ち上げるには、器と家が必要だなとつくづく思います。<br>どこででも、良い器に出会うと心落ち着きます。</p></div>
